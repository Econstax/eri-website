<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Sign Up — ERI</title>
  <link rel="icon" type="image/png" href="assets/img/eri-logo-plain.png">
  <link rel="apple-touch-icon" href="assets/img/eri-logo-plain.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <style>
    :root{--navy:#1B2A4A;--navy-dark:#0D1520;--gold:#C6A84E;--gold-light:#D4BA6A;--ease:cubic-bezier(.16,1,.3,1)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,sans-serif;background:#0D1520;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .bg{position:fixed;inset:0;background:linear-gradient(160deg,#060a10,#0D1520 40%,#1B2A4A)}
    .bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(198,168,78,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(198,168,78,.015) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 20%,transparent 70%)}
    .card{position:relative;z-index:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:22px;padding:48px 44px;width:520px;max-width:92vw;animation:cardIn .8s var(--ease) both}
    @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .logo img{width:40px;height:40px;object-fit:contain}
    .logo span{font-family:'Playfair Display',serif;font-size:1rem;color:rgba(255,255,255,.5)}
    .tag{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);background:rgba(198,168,78,.08);border:1px solid rgba(198,168,78,.15);padding:5px 14px;border-radius:50px;margin-bottom:14px}
    h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:#fff;margin-bottom:6px}
    .sub{font-size:.85rem;color:rgba(255,255,255,.4);margin-bottom:32px;line-height:1.6}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .fg{margin-bottom:16px}
    .fg label{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.45);margin-bottom:6px}
    .fg .opt{font-weight:400;text-transform:none;letter-spacing:0;color:rgba(255,255,255,.25);font-size:.68rem}
    .fg input{width:100%;padding:13px 16px;font-family:'Inter',sans-serif;font-size:.9rem;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;color:#fff;outline:none;transition:all .35s var(--ease)}
    .fg input::placeholder{color:rgba(255,255,255,.18)}
    .fg input:focus{border-color:var(--gold);background:rgba(198,168,78,.04);box-shadow:0 0 0 3px rgba(198,168,78,.06)}
    button[type="submit"]{width:100%;padding:15px;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-dark);border:none;border-radius:10px;cursor:pointer;transition:all .4s var(--ease);margin-top:8px}
    button[type="submit"]:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(198,168,78,.25)}
    button[type="submit"]:disabled{opacity:.7;cursor:not-allowed;transform:none;box-shadow:none}
    .back{display:inline-flex;align-items:center;gap:6px;margin-top:24px;font-size:.78rem;color:rgba(255,255,255,.3);text-decoration:none;transition:color .3s}
    .back:hover{color:var(--gold)}
    .msg{text-align:center;padding:8px;font-size:.82rem;border-radius:8px;margin-top:12px;display:none}
    .msg.ok{display:block;background:rgba(34,197,94,.08);color:#22c55e;border:1px solid rgba(34,197,94,.15)}
    .msg.err{display:block;background:rgba(248,113,113,.08);color:#f87171;border:1px solid rgba(248,113,113,.15)}
    @media(max-width:520px){.row{grid-template-columns:1fr}.card{padding:36px 24px}}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="logo">
      <img src="assets/img/eri-logo-plain.png" alt="ERI">
      <span>Economic Reasoning Initiative</span>
    </div>
    <span class="tag">Event Registration</span>
    <h1>Economics Seminars</h1>
    <p class="sub">Sign up for our monthly seminar series — discussions on current economic issues, policy debates, and emerging research.</p>
    <form id="form">
      <div class="row">
        <div class="fg">
          <label>First Name</label>
          <input type="text" id="fname" placeholder="First name" required>
        </div>
        <div class="fg">
          <label>Last Name</label>
          <input type="text" id="lname" placeholder="Last name" required>
        </div>
      </div>
      <div class="fg">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <div class="fg">
        <label>Phone Number <span class="opt">(optional)</span></label>
        <input type="tel" id="phone" placeholder="(555) 123-4567">
      </div>
      <button type="submit">Register for Seminars</button>
      <div class="msg" id="msg"></div>
    </form>
    <a href="index.html#events" class="back">&larr; Back to Events</a>
  </div>

  <script>
    const SUPABASE_URL='https://oliaowomacdkwgmbdnhb.supabase.co';
    const SUPABASE_KEY='sb_publishable_OlLcofeNEZpeyv57dJWkAg_zMsRcHte';
    let supabase=null;
    function initSB(){if(window.supabase&&SUPABASE_KEY!=='YOUR_ANON_KEY_HERE')supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}
    async function saveSignup(table,data){
      if(supabase){const{error}=await supabase.from(table).insert([data]);if(!error)return}
      const key='eri_'+table;const list=JSON.parse(localStorage.getItem(key)||'[]');
      data.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      data.created_at=new Date().toISOString();list.push(data);localStorage.setItem(key,JSON.stringify(list));
    }
    window.addEventListener('load',initSB);

    document.getElementById('form').addEventListener('submit',async e=>{
      e.preventDefault();
      const btn=e.target.querySelector('button[type="submit"]');
      const msg=document.getElementById('msg');
      btn.textContent='Submitting...';btn.disabled=true;
      try{
        await saveSignup('seminar_signups',{
          first_name:document.getElementById('fname').value,
          last_name:document.getElementById('lname').value,
          email:document.getElementById('email').value,
          phone:document.getElementById('phone').value||null,
        });
        btn.textContent='Registered!';btn.style.background='linear-gradient(135deg,#22c55e,#16a34a)';btn.style.color='#fff';
        msg.className='msg ok';msg.textContent='You\'re signed up! We\'ll be in touch with seminar details.';
        setTimeout(()=>{btn.textContent='Register for Seminars';btn.style.background='';btn.style.color='';btn.disabled=false;e.target.reset();msg.className='msg'},3000);
      }catch(err){
        msg.className='msg err';msg.textContent='Something went wrong. Please try again.';
        btn.textContent='Register for Seminars';btn.disabled=false;
        setTimeout(()=>{msg.className='msg'},3000);
      }
    });
  </script>
</body>
</html>
